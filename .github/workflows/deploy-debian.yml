name: Deploy Blend to Debian

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: NEXT_PUBLIC_API_URL=https://tteokyi.com npm run build
      - run: docker compose config --quiet

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Debian
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -p "$port" "$remote" '
            set -eu
            target=/home/kimminseok/docker/blend
            if [ ! -d "$target/.git" ]; then
              git clone --branch develop --single-branch git@github.com:rlaminseok0824/blend.git "$target"
            fi
            cd "$target"
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            chmod +x deploy.sh
            ./deploy.sh
          '
