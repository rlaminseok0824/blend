services:
  blend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://tteokyi.com
    image: blend:latest
    container_name: blend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - edge-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  edge-net:
    external: true
